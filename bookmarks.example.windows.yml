# focusbm Windows example config
# Location (in priority order):
#   1. FOCUSBM_YAML environment variable
#   2. bookmarks.yml next to FocusBM.exe
#   3. %AppData%/focusbm/bookmarks.yml
#
# After `make release`, release/bookmarks.yml is the colocated config used for smoke tests.
# See bookmarks.example.yml for the macOS example.

settings:
  # Global hotkey that opens the search panel.
  # Pressing it again while the panel is open runs the bookmark marked executeOnToggleRepress
  # (disabled while a preview is open)
  hotkey:
    togglePanel: "ctrl+alt+space"
    # Show the hovered (or selected) AI agent's screen, in color and live-updated (default: ctrl+p). Esc closes it
    previewHoveredAgent: "ctrl+p"
    # Tile the screens of all AI agents (default: ctrl+v). Esc closes it
    previewAllAgents: "ctrl+v"

  panelWidth: 800
  bookmarkListColumns: 2

  # Preview size is based on the target monitor's maximum. Omit for full monitor size; Ctrl+P is centered.
  # A single-line input at the bottom of the preview sends a prompt to the pane with Enter.
  previewWidth: 1200
  previewHeight: 800
  previewFontSize: 16
  fontName: "Fira Code"
  previewFontName: "JetBrains Mono"

  # The C# serializer writes the PR / agent-reload keys directly under settings
  openSessionPullRequest: "ctrl+p"
  forceReloadAgents: "ctrl+alt+r"

  showWslAgents: true
  virtuawinEnabled: true
  imeRestoreEnabled: false
  # true: bare number keys also select while filtering (2+ candidates). Default: digits go into the query
  filteredNumberKeys: false

  wslEnabled: true
  wslDistribution: Ubuntu

  # browserCdpEnabled: true
  # browserCdpEndpoint: "http://127.0.0.1:9222"

bookmarks:
  - id: github
    appName: Google Chrome
    context: work
    state:
      type: browser
      urlPattern: github.com
      title: GitHub

  - id: notepad
    appName: Notepad
    context: personal
    state:
      type: app
      windowTitle: ""

  # nvim inside WSL (itermNvim is also read as wslNvim for compatibility).
  # When the query is empty, the executeOnToggleRepress bookmark is shown as a chip in the shortcut bar.
  - id: project-nvim
    appName: Windows Terminal
    context: work
    executeOnToggleRepress: true
    state:
      type: wslNvim
      workingDirectory: /home/takets/repos/focusbm

  # enables: false hides a bookmark from lists but keeps it in the YAML
  - id: hidden-example
    appName: Notepad
    context: personal
    enables: false
    state:
      type: app
      windowTitle: ""
