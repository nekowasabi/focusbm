# focusbm macOS 設定例
# 配置先: ~/.config/focusbm/bookmarks.yml
#
# このファイルをコピーして bookmarks.yml にリネームし、
# `bookmarks` 配列を自分の用途に合わせて編集してください。
#
# 実スキーマは id / appName / bundleIdPattern / context / state / createdAt です。
# type: iterm2 は使いません（V1 の iterm2 は app に移行されます）。
# Windows 用の例は bookmarks.example.windows.yml を参照してください。

settings:
  hotkey:
    # 検索パネルを呼び出すグローバルホットキー（既定: cmd+ctrl+b）
    togglePanel: "cmd+ctrl+b"
    # 選択中の Claude Code セッションに記録された GitHub PR を開く（既定: cmd+p）
    openSessionPullRequest: "cmd+p"
    # AI エージェント一覧を手動更新する（既定: cmd+ctrl+r）
    forceReloadAgents: "cmd+ctrl+r"

  # パネル幅（pixel）。bookmarkListColumns: 2 で未指定の場合 800 が自動適用される
  panelWidth: 800

  # 一覧表示の列数（1: 縦1列 / 2: 横2列）。0, 3, 負数などの不正値は 1 にフォールバック
  bookmarkListColumns: 2

  # AI エージェント行に番号を振るか。未指定時は true。
  # showAIAgentShortcut: false

bookmarks:
  - id: github
    appName: Google Chrome
    bundleIdPattern: com.google.Chrome
    context: work
    state:
      type: browser
      urlPattern: github.com
      title: GitHub
    createdAt: "2026-08-15T00:00:00Z"

  - id: notes
    appName: Notes
    bundleIdPattern: com.apple.Notes
    context: personal
    state:
      type: app
      windowTitle: ""
    createdAt: "2026-08-15T00:00:00Z"

  # iTerm2 + tmux + nvim 専用（他ターミナル・tmux 外 nvim は対象外）:
  # - workingDirectory: 省略可。指定時だけ pane_current_path と一致する候補を優先
  # - exCommand: 省略可。指定するなら先頭コロンなしの一行
  # パネル表示中に togglePanel を再押下したとき、executeOnToggleRepress の先着1件を実行する
  - id: project-nvim
    appName: iTerm2
    bundleIdPattern: com.googlecode.iterm2
    context: work
    executeOnToggleRepress: true
    state:
      type: itermNvim
    createdAt: "2026-08-15T00:00:00Z"
