# focusbm macOS example config
# Location: ~/.config/focusbm/bookmarks.yml
#
# Copy this file to bookmarks.yml and edit the `bookmarks` array for your own use.
#
# The actual schema is id / appName / bundleIdPattern / context / state / createdAt.
# Do not use type: iterm2 (a V1 iterm2 entry is migrated to app).
# See bookmarks.example.windows.yml for the Windows example.

settings:
  hotkey:
    # Global hotkey that opens the search panel (default: cmd+ctrl+b).
    # Pressing it again while the panel is open runs the bookmark marked executeOnToggleRepress
    # (disabled while a preview is open)
    togglePanel: "cmd+ctrl+b"
    # Open the GitHub PR recorded for the selected Claude Code session (default: cmd+p)
    openSessionPullRequest: "cmd+p"
    # Show the hovered (or selected) AI agent's screen, in color and live-updated (default: ctrl+p). Esc closes it
    previewHoveredAgent: "ctrl+p"
    # Tile the screens of all AI agents (default: ctrl+v). Esc closes it
    previewAllAgents: "ctrl+v"
    # Manually refresh the AI agent list (default: cmd+ctrl+r)
    forceReloadAgents: "cmd+ctrl+r"

  # Panel width in pixels. When bookmarkListColumns: 2 and this is omitted, 800 is applied
  panelWidth: 800

  # Preview size is based on the target monitor's maximum. Omit for full monitor size; Ctrl+P is centered
  previewWidth: 1200
  previewHeight: 800
  previewFontSize: 16
  # Use separate fonts for the filter screen and the preview. previewFontName falls back to fontName
  fontName: "Fira Code"
  previewFontName: "JetBrains Mono"

  # Modifier that picks the prompt target (modifier + number) in the tiled preview: cmd or ctrl.
  # A single-line input at the bottom of the preview sends text to the pane with Enter.
  previewTargetModifier: "cmd"

  # 2 makes the default panel width 800 when panelWidth is omitted (the list is always one table column)
  bookmarkListColumns: 2

  # Number AI agent rows? Defaults to true when omitted.
  # showAIAgentShortcut: false

  # Switch the input source to ASCII (turn off Japanese IME) after a bookmark's app is activated. Default: false
  # imeOff: true

  # true: bare number keys also select while filtering (2+ candidates). Default: digits go into the query
  # filteredNumberKeys: false

bookmarks:
  - id: github
    appName: Google Chrome
    bundleIdPattern: com.google.Chrome
    context: work
    state:
      type: browser
      urlPattern: github.com
      title: GitHub
    createdAt: "2026-08-15T00:00:00Z"

  - id: notes
    appName: Notes
    bundleIdPattern: com.apple.Notes
    context: personal
    state:
      type: app
      windowTitle: ""
    createdAt: "2026-08-15T00:00:00Z"

  # For iTerm2 + tmux + nvim only (other terminals and nvim outside tmux are out of scope):
  # - workingDirectory: optional. When set, panes whose pane_current_path matches are preferred
  # - exCommand: optional. A single line without a leading colon
  # Re-pressing togglePanel while the panel is open runs the first bookmark marked executeOnToggleRepress.
  # When the query is empty it is shown as a chip in the shortcut bar instead of the main list (no number used).
  - id: project-nvim
    appName: iTerm2
    bundleIdPattern: com.googlecode.iterm2
    context: work
    executeOnToggleRepress: true
    state:
      type: itermNvim
    createdAt: "2026-08-15T00:00:00Z"

  # enables: false hides a bookmark from lists (menu bar, panel, list, switch) but keeps it in the YAML
  - id: hidden-example
    appName: Notes
    bundleIdPattern: com.apple.Notes
    context: personal
    enables: false
    state:
      type: app
      windowTitle: ""
    createdAt: "2026-08-15T00:00:00Z"
